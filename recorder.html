<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b6cb0" />
    <title>Enregistreur de mots tamouls</title>
    <style>
      :root { font-family: "Trebuchet MS", "Segoe UI", Verdana, Arial, "Noto Sans Tamil", sans-serif; color: #2d3748; }
      body { margin: 0; background: #fff6e5; }
      main { max-width: 760px; margin: 0 auto; padding: 16px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      h1 { font-size: 26px; margin: 8px 0; color: #7b341e; }
      a, button { font: inherit; }
      .lang button, .small { border: 2px solid #1a365d; background: #fff; color: #1a365d; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: bold; }
      .lang button.on { background: #2b6cb0; color: #fff; }
      .help { background: #fff; border-left: 6px solid #dd6b20; padding: 10px 14px; border-radius: 6px; }
      .warn { background: #fff5f5; border-left: 6px solid #c53030; padding: 10px 14px; border-radius: 6px; margin-top: 10px; }
      .card { background: #fff; border: 4px solid #2b6cb0; border-radius: 16px; padding: 18px; margin: 16px 0; text-align: center; }
      .count { color: #718096; font-size: 15px; }
      .taml { font-size: 56px; font-weight: bold; line-height: 1.2; margin: 6px 0 0; }
      .latn { font-size: 30px; font-weight: bold; color: #2b6cb0; }
      .meaning { font-size: 22px; margin: 4px 0; }
      .note { font-size: 15px; color: #718096; margin-top: 6px; }
      .tag { display: inline-block; font-size: 14px; background: #c6f6d5; color: #22543d; border-radius: 12px; padding: 2px 10px; margin: 4px 4px 0; }
      .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
      .big { font-size: 24px; font-weight: bold; border: 4px solid #1a365d; border-radius: 12px; padding: 12px 22px; background: #2b6cb0; color: #fff; cursor: pointer; min-width: 170px; }
      .big.rec { background: #c53030; border-color: #742a2a; }
      .big.plain { background: #fff; color: #1a365d; }
      button:disabled { opacity: 0.4; cursor: default; }
      #status { min-height: 28px; margin-top: 12px; font-size: 20px; font-weight: bold; }
      #status.ok { color: #2f855a; } #status.bad { color: #c53030; }
      .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
      pre { background: #1a202c; color: #e2e8f0; padding: 10px; border-radius: 8px; overflow-x: auto; }
      #list { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 40px; padding: 0; list-style: none; }
      #list button { border: 2px solid #cbd5e0; background: #fff; border-radius: 8px; padding: 4px 8px; cursor: pointer; font-size: 15px; }
      #list button.done { border-color: #38a169; background: #f0fff4; }
      #list button.current { border-color: #2b6cb0; outline: 3px solid #90cdf4; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="title"></h1>
        <div class="lang"><button data-lang="fr">FR</button> <button data-lang="en">EN</button></div>
      </header>
      <p class="help" id="help"></p>
      <div id="warnings"></div>
      <section class="card" id="card"></section>
      <div class="bar">
        <span id="progress"></span>
        <button class="small" id="nextTodo"></button>
        <button class="small" id="download"></button>
      </div>
      <div id="after"></div>
      <ul id="list"></ul>
      <p><a id="back" href="./index.html"></a></p>
    </main>
    <script type="module" src="/src/recorder/main.js"></script>
  </body>
</html>
