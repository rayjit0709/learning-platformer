  <rect x="46" y="94" width="68" height="54" rx="16" fill="#2a9d8f"/>
  <path d="M46 138 Q80 150 114 138 L114 148 Q80 160 46 148 Z" fill="#d4a017"/>
  <!-- neck -->
  <rect x="71" y="84" width="18" height="18" rx="6" fill="#b87942"/>
