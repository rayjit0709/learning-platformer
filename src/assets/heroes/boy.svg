<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="160" height="240">
  <!-- sandals and feet -->
  <ellipse cx="62" cy="228" rx="15" ry="7" fill="#6b3f22"/>
  <ellipse cx="98" cy="228" rx="15" ry="7" fill="#6b3f22"/>
  <ellipse cx="62" cy="223" rx="11" ry="6" fill="#c98a52"/>
  <ellipse cx="98" cy="223" rx="11" ry="6" fill="#c98a52"/>
  <!-- veshti (white wrap) with gold border -->
  <path d="M48 128 L112 128 L120 222 L40 222 Z" fill="#fff8ec" stroke="#d8c8a4" stroke-width="2"/>
  <path d="M41 208 L119 208 L120 222 L40 222 Z" fill="#d4a017"/>
  <path d="M80 130 L80 208" stroke="#e8dcc0" stroke-width="2"/>
  <!-- arms (sleeves + hands) -->
  <rect x="32" y="98" width="20" height="40" rx="10" fill="#2a9d8f"/>
  <rect x="108" y="98" width="20" height="40" rx="10" fill="#2a9d8f"/>
  <circle cx="40" cy="142" r="9" fill="#c98a52"/>
  <circle cx="120" cy="142" r="9" fill="#c98a52"/>
