  <circle cx="38" cy="64" r="9" fill="#c98a52"/>
  <circle cx="122" cy="64" r="9" fill="#c98a52"/>
  <!-- head -->
  <ellipse cx="80" cy="60" rx="42" ry="38" fill="#d49a60"/>
  <!-- hair -->
  <path d="M38 58 C32 18 66 6 82 10 C102 6 130 20 122 58 C116 40 100 32 82 32 C62 32 46 42 38 58 Z" fill="#1c1c1c"/>
  <path d="M60 14 C70 20 86 22 100 16" stroke="#3a3a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="64" cy="64" rx="10" ry="11" fill="#fff"/>
  <ellipse cx="96" cy="64" rx="10" ry="11" fill="#fff"/>
  <circle cx="65" cy="65" r="6.5" fill="#2b1b12"/>
  <circle cx="97" cy="65" r="6.5" fill="#2b1b12"/>
  <circle cx="67.5" cy="62" r="2.3" fill="#fff"/>
  <circle cx="99.5" cy="62" r="2.3" fill="#fff"/>
  <!-- eyebrows -->
  <path d="M53 50 Q64 44 74 49" stroke="#1c1c1c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M86 49 Q96 44 107 50" stroke="#1c1c1c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- blush, nose, smile -->
  <circle cx="54" cy="78" r="6" fill="#e0707a" opacity="0.35"/>
  <circle cx="106" cy="78" r="6" fill="#e0707a" opacity="0.35"/>
  <path d="M77 74 Q80 78 83 74" stroke="#a8693a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M68 82 Q80 95 92 82 Z" fill="#7a2e2e"/>
  <path d="M73 85 Q80 91 87 85 Q80 88 73 85 Z" fill="#fff"/>
